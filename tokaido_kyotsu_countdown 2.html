<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>東海道本線で共通テストまで｜Countdown Journey</title>
<style>
:root{--blue:#c65a12;--sky:#fff2df;--ink:#4a2b13;--muted:#8b6b50;--gold:#f2a13b;--orange:#c65a12;--green:#176b3a;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff0dc,#fffaf2 45%,#fff5e8);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:880px;margin:auto;padding:22px 16px 42px}.top{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:800;letter-spacing:.08em;font-size:13px}.hero{background:linear-gradient(135deg,#b84d0c,#f28a27);color:#fff;border-radius:24px;padding:26px 24px;margin-top:14px;box-shadow:0 14px 35px #0c5b8c22;position:relative;overflow:hidden}.hero:after{content:"🚃";position:absolute;right:20px;bottom:12px;font-size:74px;opacity:.16}.eyebrow{font-size:12px;letter-spacing:.12em;opacity:.85}.count{font-size:clamp(52px,13vw,86px);font-weight:900;line-height:1.05;margin:12px 0 0;letter-spacing:-.04em}.count small{font-size:22px;letter-spacing:0}.date{margin-top:8px;font-weight:650}.station-panel{background:white;border:1px solid #f1d5b6;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 6px 20px #16456a0b}.station-label{color:var(--muted);font-size:12px;letter-spacing:.12em}.station-name{font-size:clamp(32px,8vw,46px);font-weight:900;margin:4px 0 0}.station-code{display:inline-block;border:3px solid var(--blue);color:var(--blue);font-weight:800;border-radius:8px;padding:3px 10px;margin-top:8px}.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:20px 0 8px}.bar{height:12px;background:#f4e2cc;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#e98928,#bd4d0d);border-radius:99px;transition:width .5s}.route{margin:18px 0 0;position:relative;padding:8px 2px 8px 22px}.route:before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:4px;background:linear-gradient(to bottom,#c65a12 0%,#c65a12 44%,#176b3a 44%,#176b3a 100%);border-radius:10px}.route-row{position:relative;padding:7px 0 7px 12px;display:flex;align-items:center;gap:10px;font-size:14px}.dot{position:absolute;left:-19px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #b6cddd}.route-row.passed .dot{background:var(--segment);border-color:var(--segment)}.route-row.current .dot{width:20px;height:20px;left:-22px;border:4px solid var(--gold);background:#fff;box-shadow:0 0 0 4px #f9e7b8}.route-row.current{font-weight:850;color:var(--segment)}.route-row.end .dot{background:var(--green);border-color:var(--green)}.route-row small{color:var(--muted);font-size:11px;margin-left:auto}.info{font-size:13px;line-height:1.7;color:#60798d;margin-top:16px}.footer{text-align:center;color:#6f8799;font-size:12px;margin-top:22px}.btn{border:0;background:#c65a12;color:white;padding:10px 14px;border-radius:10px;font-weight:750;cursor:pointer;margin-top:12px}.btn:hover{filter:brightness(1.08)}
</style></head><body><main class="wrap"><div class="top">🚆 <span>THROUGH THE TOKAIDO LINE · EXAM COUNTDOWN</span></div>
<section class="hero"><div class="eyebrow">2027年度 大学入学共通テストまで</div><div class="count" id="days">--<small> 日</small></div><div class="date">2027年1月16日（土） 東京駅到着予定</div></section>
<section class="station-panel"><div class="station-label">TODAY'S STATION / 今日の駅</div><div class="station-name" id="station">---</div><div class="station-code" id="code">JT --</div><div class="progress-meta"><span id="progressText">旅の進捗</span><span id="pct">0%</span></div><div class="bar"><div id="bar" style="width:0%"></div></div><div class="route" id="route"></div><p class="info" id="message"></p><button class="btn" onclick="showRoute()">路線の全駅を表示／非表示</button></section>
<div class="footer">一日一駅、着実に東京へ。焦らず今日の一歩を。<br>※金谷駅から東京駅へ、日付に応じて一日一駅進むカウントダウンルートです。</div></main>
<script>
// Countdown route: start at Kanaya today (57 days remaining), arrive Tokyo on exam day.
const stations=["金谷","島田","六合","藤枝","西焼津","焼津","用宗","安倍川","静岡","東静岡","草薙","清水","興津","由比","蒲原","新蒲原","富士川","富士","吉原","東田子の浦","原","片浜","沼津","三島","函南","熱海","湯河原","真鶴","根府川","早川","小田原","鴨宮","国府津","二宮","大磯","平塚","茅ケ崎","辻堂","藤沢","大船","戸塚","東戸塚","保土ケ谷","横浜","東神奈川","新子安","鶴見","川崎","蒲田","大森","大井町","品川","高輪ゲートウェイ","田町","浜松町","新橋","有楽町","東京"];
const start=new Date(2026,10,20); // Nov 20, 2026 - Kanaya
const target=new Date(2027,0,16); // Jan 16, 2027 - Tokyo
const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const total=Math.round((target-start)/86400000);let day=Math.round((today-start)/86400000);day=Math.max(0,Math.min(total,day));
const idx=Math.min(stations.length-1,day);const pct=Math.round(day/(total||1)*100);
document.getElementById('days').innerHTML=Math.max(0,Math.ceil((target-today)/86400000))+'<small> 日</small>';
document.getElementById('station').textContent=stations[idx];document.getElementById('code').textContent='JT '+String(idx+1).padStart(2,'0');document.getElementById('pct').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';document.getElementById('progressText').textContent=`金谷出発から東京まで · ${idx+1}/${stations.length}駅`;
document.getElementById('message').textContent=idx===stations.length-1?'終点・東京駅に到着！いよいよ共通テスト本番。ここまでの努力を信じて。':`今日も一駅前進。${stations[idx]}駅まで来ました。次の駅へ向けて、今日やることを積み重ねよう。`;
let visible=false;function showRoute(){visible=!visible;const r=document.getElementById('route');if(!visible){r.innerHTML='';return;}r.innerHTML=stations.map((s,i)=>{const segment=i<=stations.indexOf("熱海")?"#c65a12":"#176b3a";return `<div class="route-row ${i<idx?'passed':i===idx?'current':''} ${i===stations.length-1?'end':''}" style="--segment:${segment}"><span class="dot"></span>${s}<small>${i===idx?'NOW':i===stations.length-1?'GOAL':''}</small></div>`;}).join('');}
</script></body></html>
